name: gate

on:
  push:
    branches: [main, kickoff]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: lint, drift check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - name: Offline fixture scores (recorded stand-ins, not a model)
        run: npm run eval
